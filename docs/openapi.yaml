            anyOf:
              - type: string
              - type: "null"
            title: Timezone
        - name: client
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Client
      responses:
        "200":
          description: Successful Response
          content:
