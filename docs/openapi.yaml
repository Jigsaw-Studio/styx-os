              - type: "null"
            title: Relative
        - name: timezone
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Timezone
        - name: client
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Client
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrafficRawData'
                title: Response Get Raw Data V1 Raw Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TrafficMatrixSummary:
      properties:
        address:
          type: string
          title: Address
        sent:
          type: integer
          title: Sent
          default: 0
        received:
          type: integer
          title: Received
          default: 0
        count:
          type: integer
          title: Count
          default: 0
      type: object
      required:
        - address
      title: TrafficMatrixSummary
    TrafficRawData:
      properties:
        timestamp:
          type: string
          title: Timestamp
        local:
          type: string
          title: Local
        remote:
          type: string
          title: Remote
        port:
          type: integer
          title: Port
        sent:
          type: integer
          title: Sent
        received:
          type: integer
          title: Received
        domain:
          anyOf:
            - type: string
            - type: "null"
          title: Domain
      type: object
      required:
        - timestamp
        - local
        - remote
        - port
        - sent
        - received
        - domain
      title: TrafficRawData
    TrafficSummary:
      properties:
        address:
          type: string
          title: Address
        sent:
          type: integer
          title: Sent
          default: 0
        received:
          type: integer
          title: Received
          default: 0
      type: object
      required:
        - address
      title: TrafficSummary
    TrafficTotals:
      properties:
        sent:
          type: integer
          title: Sent
          default: 0
        received:
          type: integer
          title: Received
          default: 0
      type: object
      title: TrafficTotals
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
