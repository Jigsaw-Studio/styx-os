              schema:
                $ref: '#/components/schemas/TrafficTotals'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/matrix:
    get:
      summary: Retrieve sorted traffic summary by domain or IP
      description: "Retrieves a sorted summary of network traffic grouped by domain name (if available) or remote IP address. \nEach entry includes:\n\n- **Address:** The domain name if known, otherwise the remote IP (optionally with port).\n- **Sent:** Total bytes sent to this address.\n- **Received:** Total bytes received from this address.\n- **Count:** The number of times this address was accessed.\n\nResults are ordered by **highest access count**.\n\n**Query Parameters:**\n- `start_date`: Start date filter (`YYYY-MM-DD`).\n- `start_time`: Start time filter (`HH:MM:SS`).\n- `end_date`: End date filter (`YYYY-MM-DD`).\n- `end_time`: End time filter (`HH:MM:SS`).\n- `relative`: Relative time range (e.g., `60s`, `30m`, `1h`).\n- `timezone`: Timezone for timestamps (e.g., `UTC`, `America/New_York`).\n- `client`: Filter by a specific local IP.\n\n**Example Response:**\n```json\n[\n  {\n    \"address\": \"example.com:443\",\n    \"sent\": 12345,\n    \"received\": 67890,\n    \"count\": 42\n  },\n  {\n    \"address\": \"192.168.1.100:80\",\n    \"sent\": 5120,\n    \"received\": 10240,\n    \"count\": 18\n  }\n]\n```"
      operationId: get_matrix_summary_v1_matrix_get
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Start Date
        - name: start_time
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Start Time
        - name: end_date
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: End Date
        - name: end_time
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: End Time
        - name: relative
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Relative
        - name: timezone
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Timezone
        - name: client
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Client
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrafficMatrixSummary'
                title: Response Get Matrix Summary V1 Matrix Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
