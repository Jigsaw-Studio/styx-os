  /v1/network:
    get:
      summary: Retrieve total network traffic
      description: |-
        Retrieves the total amount of network traffic sent and received.

        **Response:**
        ```json
        {
          "sent": 1048576,
          "received": 2097152
        }
        ```

        **Query Parameters:**
        - `start_date`, `start_time`, `end_date`, `end_time`: Absolute time filters.
        - `relative`: Relative time range (e.g., `60s`, `30m`, `1h`).
        - `timezone`: Timezone for timestamps.
        - `client`: Filter by a specific local IP.
      operationId: get_network_summary_v1_network_get
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Start Date
        - name: start_time
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Start Time
        - name: end_date
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: End Date
        - name: end_time
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: End Time
        - name: relative
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Relative
        - name: timezone
          in: query
          required: false
