openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /v1/domain:
    get:
      summary: Retrieve traffic summary by domain
      description: |-
        Retrieves a summary of network traffic grouped by domain name.
        Each entry includes:

        - **Address:** The domain name accessed.
        - **Sent:** Total bytes sent to this domain.
        - **Received:** Total bytes received from this domain.

        **Query Parameters:**
        - `start_date`, `start_time`, `end_date`, `end_time`: Absolute time filters.
        - `relative`: Relative time range (e.g., `60s`, `30m`, `1h`).
        - `timezone`: Timezone for timestamps.
        - `client`: Filter by a specific local IP.
      operationId: get_domain_summary_v1_domain_get
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Start Date
        - name: start_time
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Start Time
        - name: end_date
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: End Date
        - name: end_time
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: End Time
        - name: relative
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Relative
        - name: timezone
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Timezone
        - name: client
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Client
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrafficSummary'
                title: Response Get Domain Summary V1 Domain Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
