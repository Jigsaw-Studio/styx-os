            anyOf:
              - type: string
              - type: "null"
            title: Start Time
        - name: end_date
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: End Date
        - name: end_time
          in: query
          required: false
          schema:
            anyOf:
